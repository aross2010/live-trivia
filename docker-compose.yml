services:
  redis:
    image: redis:7-alpine # pre-built image from docker hub
    restart: unless-stopped # auto-restart in case of crash

  server1: # first server instance
    build: ./server # build image from Dockerfile in server directory
    environment: # env vars
      - PORT=3001
      - REDIS_HOST=redis
      - WS_BASE_URL=ws://localhost/ws/1 # external url nginx uses to route players to this server
    depends_on:
      - redis # start redis before this server

  server2: # second server instance
    build: ./server
    environment:
      - PORT=3002
      - REDIS_HOST=redis
      - WS_BASE_URL=ws://localhost/ws/2
    depends_on:
      - redis

  server3: # third server instance
    build: ./server
    environment:
      - PORT=3003
      - REDIS_HOST=redis
      - WS_BASE_URL=ws://localhost/ws/3
    depends_on:
      - redis

  nginx:
    image: nginx:alpine # pre-built image from docker hub
    ports:
      - '80:80' # maps port 80 on host to port 80 in container (host:container)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on: # starts all servers before nginx
      - server1
      - server2
      - server3

networks:
  default:
    driver: bridge
