# define servers
upstream all_servers {
    server server1:3001; # docker defined name and port
    server server2:3002; 
    server server3:3003;
}

# handles incoming requests
server {
    listen 80; # standard HTTP port

    # entry point for new players — round-robin across all servers
    location /ws {
        proxy_pass http://all_servers; # forwards req to all_servers, picks one based on load balancing
        proxy_http_version 1.1; # use http/1.1 for WebSocket support
        proxy_set_header Upgrade $http_upgrade; # handle WebSocket upgrade
        proxy_set_header Connection "upgrade"; # handle WebSocket upgrade
        proxy_set_header Host $host; # preserve original host header
    }

    # move to server 1 (when player's oppenent is on server 1)
    location /ws/1 {
        proxy_pass http://server1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /ws/2 {
        proxy_pass http://server2:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /ws/3 {
        proxy_pass http://server3:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
